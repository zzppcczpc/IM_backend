<!DOCTYPE html>
<html>
<head>
    <title>分享的聊天记录</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
        .message { padding: 10px; border-bottom: 1px solid #eee; }
        .sender { color: #666; font-size: 12px; }
        .content { margin-top: 5px; }
        .time { color: #999; font-size: 10px; }
        .header { background: #f5f5f5; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h3>分享的聊天记录</h3>
        <p>分享者: {{ forward_user }}</p>
        <p>分享时间: {{ forward_time }}</p>
    </div>
    {% for msg in messages %}
    <div class="message">
        <div class="sender">{{ msg.sender_username }}</div>
        <div class="content">{{ msg.content }}</div>
        <div class="time">{{ msg.created_at }}</div>
    </div>
    {% endfor %}
</body>
</html>
